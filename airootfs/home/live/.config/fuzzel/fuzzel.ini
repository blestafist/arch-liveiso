# Fuzzel Configuration
# Catppuccin Mocha theme with modern styling

[main]
# Font settings
font=JetBrains Mono Nerd Font:weight=medium:size=13
use-bold=yes
dpi-aware=auto
line-height=18
letter-spacing=0

# Search behavior
fields=name,generic,comment,categories,filename,keywords
match-mode=fuzzy
sort-result=yes
match-counter=yes
show-actions=yes
list-executables-in-path=no

# Terminal for CLI apps
terminal=foot -e

# Appearance
prompt=" "
anchor=center
width=50
lines=18
horizontal-pad=35
vertical-pad=15
inner-pad=12

# Layer and focus
layer=overlay
exit-on-keyboard-focus-loss=yes

# Image settings
image-size-ratio=0.5

[colors]
# Catppuccin Mocha with transparency
background=1e1e2ef0
text=cdd6f4ff
prompt=cba6f7ff
placeholder=6c7086ff
input=cdd6f4ff
match=f38ba8ff
selection=45475aff
selection-text=cdd6f4ff
selection-match=f9e2afff
counter=a6adc8ff
border=b4befeff

[border]
width=2
radius=12

[dmenu]
mode=text
exit-immediately-if-empty=no
