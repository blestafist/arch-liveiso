# Warm charcoal and amber: matches the personal Niri borders and Zed theme.
[main]
font=JetBrainsMono Nerd Font:size=13
terminal=foot
prompt="❯  "
placeholder=Search applications…
icon-theme=Adwaita
icons-enabled=yes
layer=overlay
anchor=center
width=38
lines=9
horizontal-pad=24
vertical-pad=20
inner-pad=12
line-height=32

[colors]
background=242424ff
text=f3eee8ff
prompt=ffc87fff
placeholder=b6ada3ff
input=f3eee8ff
match=ffc87fff
selection=ffc87fff
selection-text=242424ff
selection-match=5b3416ff
border=ffc87fff

[border]
width=2
radius=12

[dmenu]
exit-immediately-if-empty=yes
