LABEL arch
TEXT HELP
Copy Code Live to RAM and start the disposable coding desktop.
Session changes are lost on shutdown. No disk swap is enabled.
ENDTEXT
MENU LABEL Code Live - RAM-only (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%
